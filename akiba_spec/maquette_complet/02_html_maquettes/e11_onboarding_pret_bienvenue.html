<script>
  (function () {
    const celebrationRig = document.getElementById('celebration-rig');
    const dashboardBtn = document.getElementById('btn-dashboard');
    const tourBtn = document.getElementById('btn-guided-tour');

    if (celebrationRig) {
      celebrationRig.addEventListener('click', function () {
        celebrationRig.classList.add('scale-105');
        setTimeout(() => {
          celebrationRig.classList.remove('scale-105');
        }, 200);
      });
    }

    if (dashboardBtn) {
      dashboardBtn.addEventListener('click', function () {
        // Haptic feedback simulation & graceful redirect
        dashboardBtn.style.opacity = '0.85';
        setTimeout(() => {
          dashboardBtn.style.opacity = '1';
        }, 150);
      });
    }

    if (tourBtn) {
      tourBtn.addEventListener('click', function () {
        tourBtn.classList.toggle('opacity-75');
        setTimeout(() => {
          tourBtn.classList.remove('opacity-75');
        }, 150);
      });
    }
  })();

<script>
  (function() {
    let currentVal = '2500';
    const amountEl = document.getElementById('amount-val');
    const ctaAmountEl = document.getElementById('cta-amount-label');

    function formatAmount(str) {
      if (!str || str === '0') return '0';
      const num = parseInt(str.replace(/\s/g, ''), 10);
      if (isNaN(num)) return '0';
      return num.toLocaleString('fr-FR');
    }

    function updateDisplay() {
      const formatted = formatAmount(currentVal);
      amountEl.textContent = formatted;
      ctaAmountEl.textContent = formatted + ' FCFA';
    }

    document.querySelectorAll('.num-key').forEach(button => {
      button.addEventListener('click', () => {
        const val = button.textContent.trim();
        if (val === '.') return; // Whole FCFA typically has no decimals
        if (currentVal.length >= 8) return;
        if (currentVal === '0') {
          currentVal = val;
        } else {
          currentVal += val;
        }
        updateDisplay();
      });
    });

    const backspaceBtn = document.getElementById('backspace-key');
    if (backspaceBtn) {
      backspaceBtn.addEventListener('click', () => {
        if (currentVal.length > 1) {
          currentVal = currentVal.slice(0, -1);
        } else {
          currentVal = '0';
        }
        updateDisplay();
      });
    }

    // Toggle categories
    const categoryButtons = document.querySelectorAll('div.flex.gap-2.overflow-x-auto:nth-of-type(1) button');
    categoryButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        categoryButtons.forEach(b => {
          b.className = 'inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-surface-elevated text-text-primary shrink-0 active:scale-95 transition-transform hover:bg-surface-icon-tile';
          const icon = b.querySelector('.material-symbols-outlined');
          if (icon) icon.className = 'material-symbols-outlined text-[18px] text-text-muted';
          const txt = b.querySelector('span:last-child');
          if (txt) txt.className = 'font-label-button text-body-sm';
        });
        btn.className = 'inline-flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-primary text-on-primary shadow-sm shrink-0 active:scale-95 transition-transform';
        const icon = btn.querySelector('.material-symbols-outlined');
        if (icon) icon.className = 'material-symbols-outlined text-[18px]';
        const txt = btn.querySelector('span:last-child');
        if (txt) txt.className = 'font-label-button text-body-sm font-semibold';
      });
    });
  })();
</script></main></body></html>

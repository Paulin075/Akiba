<!DOCTYPE html>

<html class="bg-surface" lang="fr"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { colors: { "surface-container-low": "#f9f3e5", "primary-fixed-dim": "#ffb598", "sand-highlight": "#E8D5A8", "secondary-container": "#fdd174", "on-secondary-fixed-variant": "#5b4300", "secondary-fixed": "#ffdf9e", "surface-container-high": "#ede8da", "inverse-primary": "#ffb598", "on-primary-fixed": "#370e00", "tertiary-fixed": "#ffdbce", "status-success": "#5E9E6E", "surface-elevated": "#F3E9D6", "on-secondary-container": "#775800", "text-on-terracotta": "#FFF8EC", "status-danger": "#C94B3F", "on-surface-variant": "#55433b", "secondary-fixed-dim": "#ebc165", "surface": "#fff9eb", "surface-tint": "#9a451e", "surface-dim": "#dfdacc", "on-secondary": "#ffffff", "surface-variant": "#e8e2d4", "background": "#fff9eb", "on-error": "#ffffff", "outline-variant": "dcc1b7", "surface-card": "#FFFFFF", "text-muted": "#6F685B", "surface-container-lowest": "#ffffff", "inverse-surface": "#333027", "on-primary-fixed-variant": "#7b2e07", "inverse-on-surface": "#f6f0e2", "tertiary-fixed-dim": "#ffb599", "on-secondary-fixed": "#261a00", "on-tertiary-fixed-variant": "#7a300d", "surface-bright": "#fff9eb", "text-primary": "#1A1816", "on-surface": "#1d1c13", "tertiary-container": "#b45c36", "surface-container-highest": "#e8e2d4", "on-tertiary-fixed": "#370e00", "status-warning": "#E0963A", "on-tertiary": "#ffffff", "surface-container": "#f3ede0", "secondary": "#795900", "on-primary": "#ffffff", "on-background": "#1d1c13", "primary-container": "#b65a31", "on-error-container": "#93000a", "on-tertiary-container": "#fffbff", "surface-icon-tile": "#F1DFC8", "on-primary-container": "#fffbff", "error-container": "#ffdad6", "tertiary": "#954421", "outline": "#88726a", "error": "#ba1a1a", "primary": "#97431c", "primary-fixed": "#ffdbce" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "space-sm": "8px", "margin-tablet": "32px", "space-xs": "4px", "gutter": "12px", "space-xl": "24px", "margin": "20px", "space-lg": "16px", "space-2xl": "32px", "space-md": "12px" }, fontFamily: { "hero-balance": ["Inter"], "label-uppercase": ["Plus Jakarta Sans"], "body-sm": ["Plus Jakarta Sans"], "headline-lg": ["Plus Jakarta Sans"], "hero-balance-mobile": ["Inter"], "row-amount": ["Inter"], "body-md": ["Plus Jakarta Sans"], "headline-md": ["Plus Jakarta Sans"], "section-amount": ["Inter"], "label-button": ["Plus Jakarta Sans"], "caption": ["Plus Jakarta Sans"] }, fontSize: { "hero-balance": ["36px", { lineHeight: "44px", letterSpacing: "-0.02em", fontWeight: "700" }], "label-uppercase": ["11px", { lineHeight: "14px", letterSpacing: "0.06em", fontWeight: "600" }], "body-sm": ["13px", { lineHeight: "18px", fontWeight: "400" }], "headline-lg": ["22px", { lineHeight: "28px", fontWeight: "700" }], "hero-balance-mobile": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "700" }], "row-amount": ["15px", { lineHeight: "20px", fontWeight: "600" }], "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }], "headline-md": ["17px", { lineHeight: "24px", fontWeight: "600" }], "section-amount": ["26px", { lineHeight: "32px", letterSpacing: "-0.01em", fontWeight: "700" }], "label-button": ["14px", { lineHeight: "20px", fontWeight: "600" }], "caption": ["12px", { lineHeight: "16px", fontWeight: "400" }] } } } };</script><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#fff9eb;font-family:'Plus Jakarta Sans',sans-serif;color:#1d1c13;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style></head><body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 w-full bg-surface"><div class="flex flex-col w-full relative min-h-full justify-between items-center px-margin overflow-hidden py-space-xl">
<!-- Top Decorative Geometric Triangle Frieze (West African cauri & diamond inspired) -->
<div class="absolute -top-1 left-0 right-0 h-10 pointer-events-none opacity-35 overflow-hidden flex justify-center text-sand-highlight">
<svg class="w-full h-full" fill="currentColor" preserveaspectratio="repeat-x" viewbox="0 0 360 24">
<path d="M0 0 L15 20 L30 0 L45 20 L60 0 L75 20 L90 0 L105 20 L120 0 L135 20 L150 0 L165 20 L180 0 L195 20 L210 0 L225 20 L240 0 L255 20 L270 0 L285 20 L300 0 L315 20 L330 0 L345 20 L360 0 Z"></path>
</svg>
</div>
<!-- Ambient Glow in Brand Terracotta -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-64 h-64 rounded-full bg-primary-fixed-dim/25 blur-3xl pointer-events-none"></div>
<!-- Upper Content Area: Emblem & Brand Hierarchy -->
<div class="flex flex-col items-center w-full z-10 pt-space-xl text-center">
<!-- Tactile Squircle Icon Housing Emblem -->
<div class="relative group my-space-md">
<div class="w-24 h-24 rounded-[28px] bg-inverse-surface shadow-xl flex items-center justify-center p-space-md transition-transform duration-300 active:scale-95">
<img alt="AKIBA Emblem" class="w-full h-full object-contain filter drop-shadow-sm select-none pointer-events-none" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBHIQmeEGp9oQ4ukVCGic3CehodpZn64uT_VJ4CC1UI4wq38hVewTek5MnDkjyUXwDT52UvvTWsoeFoWC7GrgxyTZup3rFjzuSiKunUE8RbRc5Itgf_7z4tbFcFjR-Dm0HZ6U5qvLPC8Fj0ABAceMtH2Q08A3UJ8tm696xeBP7uqXIsaJ6tskn-aAlqEQ1a2UlC8nxT18xGgODEQCG5Z7qxs73SR3khLyaUcV5-C9LG7XYPQKBzVd_GaA"/>
</div>
<!-- Subtle Cowrie Decorative Halo -->
<div class="absolute -inset-1 rounded-[32px] bg-sand-highlight/20 -z-10 blur-sm"></div>
</div>
<!-- Title & Brand Proposition -->
<h1 class="font-headline-lg text-headline-lg tracking-wider text-text-primary mt-space-md uppercase">
      AKIBA
    </h1>
<p class="font-body-md text-body-md text-text-muted mt-space-xs max-w-xs font-normal">
      Votre argent, clair et à vous
    </p>
<!-- Cultural micro-badge of trust -->
<div class="inline-flex items-center gap-1.5 px-3 py-1 mt-space-md rounded-full bg-surface-elevated text-secondary font-label-uppercase text-label-uppercase tracking-wider">
<span class="material-symbols-outlined text-[14px]">shield_lock</span>
<span>100% LOCAL ET CONFIDENTIEL</span>
</div>
</div>
<!-- Interactive Middle / Lower Segment -->
<div class="flex flex-col w-full z-10 items-center space-y-space-xl mt-space-2xl pb-space-lg">
<!-- Language Selector Segmented Pills -->
<div class="flex flex-col items-center gap-2">
<span class="font-caption text-caption text-text-muted uppercase tracking-widest text-[10px]">Langue d'affichage</span>
<div aria-label="Sélection de la langue" class="p-1 rounded-full bg-surface-elevated flex items-center gap-1 shadow-sm" role="radiogroup">
<!-- French (Active) -->
<button aria-checked="true" class="h-9 px-4 rounded-full bg-surface-card text-text-primary font-body-sm text-body-sm font-semibold flex items-center gap-1.5 shadow-sm transition-all duration-200" id="btn-lang-fr" onclick="selectLanguage('fr')" role="radio" type="button">
<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: 'FILL' 1;">check</span>
<span>Français</span>
</button>
<!-- English (Alternate) -->
<button aria-checked="false" class="h-9 px-4 rounded-full text-text-muted font-body-sm text-body-sm hover:text-text-primary transition-all duration-200" id="btn-lang-en" onclick="selectLanguage('en')" role="radio" type="button">
<span>English</span>
</button>
</div>
</div>
<!-- Actions Stack: CTA & Restore Backup -->
<div class="flex flex-col w-full max-w-xs items-center gap-space-md">
<!-- Primary Action: Commencer -->
<button class="w-full h-12 rounded-full bg-primary text-on-primary font-label-button text-label-button shadow-md flex items-center justify-center gap-2 transition-all duration-150 active:scale-[0.98] active:opacity-95" type="button">
<span>Commencer</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
<!-- Secondary Action: Restauration avec icône -->
<button class="h-10 px-4 rounded-full text-text-muted font-body-sm text-body-sm flex items-center gap-2 hover:bg-surface-elevated/60 active:scale-95 transition-all" type="button">
<span class="material-symbols-outlined text-[18px]">settings_backup_restore</span>
<span>J'ai déjà une sauvegarde</span>
</button>
</div>
</div>
<!-- Bottom Decorative Geometric Triangle Frieze -->
<div class="absolute -bottom-1 left-0 right-0 h-10 pointer-events-none opacity-35 overflow-hidden flex justify-center text-sand-highlight rotate-180">
<svg class="w-full h-full" fill="currentColor" preserveaspectratio="repeat-x" viewbox="0 0 360 24">
<path d="M0 0 L15 20 L30 0 L45 20 L60 0 L75 20 L90 0 L105 20 L120 0 L135 20 L150 0 L165 20 L180 0 L195 20 L210 0 L225 20 L240 0 L255 20 L270 0 L285 20 L300 0 L315 20 L330 0 L345 20 L360 0 Z"></path>
</svg>
</div>
</div>
<script>
  function selectLanguage(lang) {
    const btnFr = document.getElementById('btn-lang-fr');
    const btnEn = document.getElementById('btn-lang-en');

    if (lang === 'fr') {
      btnFr.className = "h-9 px-4 rounded-full bg-surface-card text-text-primary font-body-sm text-body-sm font-semibold flex items-center gap-1.5 shadow-sm transition-all duration-200";
      btnFr.setAttribute('aria-checked', 'true');
      btnFr.innerHTML = '<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: \'FILL\' 1;">check</span><span>Français</span>';

      btnEn.className = "h-9 px-4 rounded-full text-text-muted font-body-sm text-body-sm hover:text-text-primary transition-all duration-200";
      btnEn.setAttribute('aria-checked', 'false');
      btnEn.innerHTML = '<span>English</span>';
    } else {
      btnEn.className = "h-9 px-4 rounded-full bg-surface-card text-text-primary font-body-sm text-body-sm font-semibold flex items-center gap-1.5 shadow-sm transition-all duration-200";
      btnEn.setAttribute('aria-checked', 'true');
      btnEn.innerHTML = '<span class="material-symbols-outlined text-[16px] text-primary" style="font-variation-settings: \'FILL\' 1;">check</span><span>English</span>';

      btnFr.className = "h-9 px-4 rounded-full text-text-muted font-body-sm text-body-sm hover:text-text-primary transition-all duration-200";
      btnFr.setAttribute('aria-checked', 'false');
      btnFr.innerHTML = '<span>Français</span>';
    }
  }
</script></main></body></html>

<script>
  // Simple micro-interaction for PIN entry demonstration
  let pinLength = 3;
  const dots = [
    document.getElementById('pin-dot-1'),
    document.getElementById('pin-dot-2'),
    document.getElementById('pin-dot-3'),
    document.getElementById('pin-dot-4')
  ];

  function updateDots() {
    dots.forEach((dot, index) => {
      if (index < pinLength) {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-primary shadow-[0_0_10px_rgba(151,67,28,0.35)] transition-all';
      } else {
        dot.className = 'w-3.5 h-3.5 rounded-full bg-sand-highlight transition-all';
      }
    });
  }

  document.querySelectorAll('.pin-key').forEach(button => {
    button.addEventListener('click', () => {
      if (pinLength < 4) {
        pinLength++;
        updateDots();
      }
    });
  });

  const backspaceBtn = document.getElementById('btn-backspace');
  if (backspaceBtn) {
    backspaceBtn.addEventListener('click', () => {
      if (pinLength > 0) {
        pinLength--;
        updateDots();
      }
    });
  }
